name: Construire l'APK Bank Lambert
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleRelease --no-daemon
      - name: Publier l'APK non signé sur la branche apk-build
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/release/*.apk /tmp/out/bank-lambert-unsigned.apk
          cd /tmp/out && git init -q && git checkout -q -b apk-build
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "APK non signé ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
